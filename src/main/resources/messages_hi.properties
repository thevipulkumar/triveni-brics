trust.1.title=पूरी पकी हुई ईंट
trust.1.text=हर लॉट लोड करने से पहले जाँची जाती है। आपकी डिलीवरी में कच्ची या आधी पकी ईंट नहीं जाएगी।
trust.2.title=सबके लिए एक रेट
trust.2.text=एक साफ़ रेट लिस्ट। कोई छिपा खर्च नहीं, ऑर्डर के बाद रेट नहीं बदलता।
trust.3.title=आपकी साइट तक डिलीवरी
trust.3.text=ट्रैक्टर-ट्रॉली और ट्रक लोड सीधे आपके प्लॉट या गाँव तक पहुँचाया जाता है।
