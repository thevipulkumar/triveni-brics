about.title={0} के बारे में
about.lead=एक पारिवारिक ईंट भट्टा, जो {0} साल से एक ही सीधा वादा निभा रहा है - ग्राहक को भरोसे की ईंट दो, और वही रेट लो जो शुरू में बताया था।
about.story.title=हमारी कहानी
about.story.1=यह भट्टा हमारे परिवार ने आस-पास के गाँव और कस्बों में ईंट पहुँचाने के लिए शुरू किया था। जो काम बैलगाड़ी और कुछ हज़ार ईंट से शुरू हुआ, आज बिल्डर, ठेकेदार, सरकारी काम और अपना पहला घर बनाने वाले परिवारों तक पहुँचता है।
about.story.2=हम आज भी वही काम उसी तरह करते हैं। मिट्टी ठीक से खोदी और पकाई जाती है। ईंट पूरे समय तक जमाकर जलाई जाती है। और फ़ोन पर जो रेट बताया जाता है, उतारते समय वही रेट लिया जाता है।
