about.title=About {0}
about.lead=A family brick kiln run with the same simple promise for over {0} years - give the customer a brick they can trust, at a rate they were told at the start.
about.story.title=Our story
about.story.1=The kiln was started by our family to supply bricks to nearby villages and towns. What began with bullock carts and a few thousand bricks a season now serves builders, contractors, government works and families building their first house.
about.story.2=We still do the same things that got us here. The clay is dug and weathered properly. The bricks are stacked and burnt the full time they need. And the rate we tell you on the phone is the rate you pay at unloading.
